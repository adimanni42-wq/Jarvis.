<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #03050a;
  color: #dffaff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(0,170,255,.15), transparent 35%),
    linear-gradient(rgba(0,180,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,180,255,.03) 1px, transparent 1px);
  background-size: auto, 35px 35px, 35px 35px;
  pointer-events: none;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  border-bottom: 1px solid rgba(0,220,255,.25);
}
.logo {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
}
.status {
  color: #00ffae;
  font-size: 12px;
}
main {
  max-width: 900px;
  margin: auto;
  padding: 30px 18px;
}
.reactor {
  width: 230px;
  height: 230px;
  margin: 20px auto 35px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #00c8ff;
  box-shadow:
    0 0 25px #00c8ff,
    0 0 70px rgba(0,200,255,.35),
    inset 0 0 30px rgba(0,200,255,.4);
  animation: pulse 2s infinite alternate;
}
.reactor::before,
.reactor::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(0,220,255,.5);
}
.reactor::before {
  inset: 18px;
  animation: spin 7s linear infinite;
}
.reactor::after {
  inset: 42px;
  border-style: dashed;
  animation: spinReverse 4s linear infinite;
}
.core {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #bff7ff;
  box-shadow:
    0 0 20px #00d9ff,
    0 0 50px #00aaff,
    0 0 90px rgba(0,170,255,.8);
}
@keyframes pulse {
  from { transform: scale(.97); }
  to { transform: scale(1.03); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes spinReverse {
  to { transform: rotate(-360deg); }
}
.title {
  text-align: center;
  font-size: 32px;
  letter-spacing: 8px;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: #7195a5;
  font-size: 13px;
  margin-bottom: 30px;
}
.panel {
  border: 1px solid rgba(0,210,255,.25);
  background: rgba(5,15,25,.75);
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 0 25px rgba(0,150,255,.05);
}
.panel h2 {
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 14px;
  color: #00cfff;
}
.chat {
  height: 230px;
  overflow-y: auto;
  padding-right: 5px;
}
.message {
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}
.jarvis {
  background: rgba(0,180,255,.08);
  border-left: 3px solid #00cfff;
}
.user {
  background: rgba(255,255,255,.05);
  border-left: 3px solid #777;
}
.controls {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
input {
  flex: 1;
  background: #071019;
  border: 1px solid rgba(0,210,255,.3);
  color: white;
  border-radius: 10px;
  padding: 13px;
  outline: none;
}
button {
  border: 1px solid #00cfff;
  background: rgba(0,180,255,.1);
  color: #dffaff;
  padding: 12px 16px;
  border-radius: 10px;
  cursor: pointer;
}
button:hover {
  background: rgba(0,180,255,.25);
}
.mic {
  width: 55px;
  font-size: 20px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat {
  text-align: center;
  padding: 15px 5px;
  background: rgba(255,255,255,.025);
  border-radius: 10px;
}
.stat strong {
  display: block;
  color: #00d5ff;
  font-size: 20px;
  margin-bottom: 5px;
}
.stat span {
  color: #66818d;
  font-size: 11px;
}
.commands {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.command {
  padding: 13px;
  text-align: left;
}
footer {
  text-align: center;
  color: #49606b;
  font-size: 11px;
  padding: 20px;
}
@media (max-width: 600px) {
  .reactor {
    width: 190px;
    height: 190px;
  }
  .title {
    font-size: 25px;
  }
  .stats {
    grid-template-columns: 1fr;
  }
  .commands {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo">JARVIS</div>
  <div class="status">● ONLINE</div>
</header>
<main>
  <div class="reactor">
    <div class="core"></div>
  </div>
  <h1 class="title">J.A.R.V.I.S</h1>
  <p class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</p>
  <section class="panel">
    <h2>CONVERSATION</h2>
    <div class="chat" id="chat">
      <div class="message jarvis">
        JARVIS: Good evening. All systems are operational.
      </div>
      <div class="message jarvis">
        JARVIS: How may I assist you?
      </div>
    </div>
    <div class="controls">
      <input
        id="commandInput"
        type="text"
        placeholder="Enter a command..."
        onkeydown="handleKey(event)"
      >
      <button onclick="sendCommand()">SEND</button>
      <button class="mic" onclick="startListening()">🎤</button>
    </div>
  </section>
  <section class="panel">
    <h2>SYSTEM STATUS</h2>
    <div class="stats">
      <div class="stat">
        <strong id="clock">--:--</strong>
        <span>TIME</span>
      </div>
      <div class="stat">
        <strong>100%</strong>
        <span>SYSTEM</span>
      </div>
      <div class="stat">
        <strong>ONLINE</strong>
        <span>NETWORK</span>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>QUICK COMMANDS</h2>
    <div class="commands">
      <button class="command" onclick="quickCommand('What time is it?')">
        🕐 What time is it?
      </button>
      <button class="command" onclick="quickCommand('System status')">
        ⚙️ System status
      </button>
      <button class="command" onclick="quickCommand('Hello Jarvis')">
        👋 Say hello
      </button>
      <button class="command" onclick="quickCommand('Run diagnostics')">
        🔍 Run diagnostics
      </button>
    </div>
  </section>
</main>
<footer>
  JARVIS AI INTERFACE • PART 1
</footer>
<script>
function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const message = document.createElement("div");
  message.className = "message " + type;
  message.textContent = text;
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}
function sendCommand() {
  const input = document.getElementById("commandInput");
  const command = input.value.trim();
  if (!command) return;
  addMessage("YOU: " + command, "user");
  input.value = "";
  setTimeout(() => {
    let response = "I'm currently running in interface mode. My AI brain will be connected in Part 2.";
    const lower = command.toLowerCase();
    if (lower.includes("hello") || lower.includes("hi")) {
      response = "Hello. It is a pleasure to assist you.";
    }
    else if (lower.includes("time")) {
      response = "The current time is " + new Date().toLocaleTimeString();
    }
    else if (lower.includes("status")) {
      response = "All interface systems are operational.";
    }
    else if (lower.includes("diagnostic")) {
      response = "Running diagnostics... Interface systems: OK.";
    }
    addMessage("JARVIS: " + response, "jarvis");
  }, 500);
}
function quickCommand(command) {
  document.getElementById("commandInput").value = command;
  sendCommand();
}
function handleKey(event) {
  if (event.key === "Enter") {
    sendCommand();
  }
}
function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });
}
setInterval(updateClock, 1000);
updateClock();
function startListening() {
  if (!("webkitSpeechRecognition" in window) &&
      !("SpeechRecognition" in window)) {
    addMessage(
      "JARVIS: Voice recognition is not supported in this browser.",
      "jarvis"
    );
    return;
  }
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.start();
  addMessage("JARVIS: Listening...", "jarvis");
  recognition.onresult = function(event) {
    const text =
      event.results[0][0].transcript;
    document.getElementById("commandInput").value = text;
    sendCommand();
  };
  recognition.onerror = function() {
    addMessage(
      "JARVIS: I couldn't hear that. Please try again.",
      "jarvis"
    );
  };
}
</script>
</body>
</html>
